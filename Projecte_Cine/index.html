<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Benvingut a CineManager</title>
    <style>
        /* Animació de zoom suau per al fons de pantalla */
        @keyframes subtleZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0;
            background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, rgba(0,0,0,0.5) 100%), 
                        linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            overflow: hidden;
            animation: subtleZoom 20s infinite alternate ease-in-out;
        }

        .hero {
            max-width: 700px;
            padding: 50px;
            background: rgba(10, 10, 10, 0.65);
            border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 30px rgba(0,212,255,0.1);
            position: relative;
            z-index: 10;
        }

        h1 { 
            font-size: 4.5rem; 
            margin: 0; 
            color: #00d4ff; 
            text-shadow: 0 0 20px rgba(0,212,255,0.6), 2px 2px 10px rgba(0,0,0,0.8); 
        }

        p { 
            font-size: 1.4rem; 
            margin: 25px 0 45px; 
            color: #ffffff; 
            line-height: 1.6;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .btn-start {
            background: linear-gradient(45deg, #00d4ff, #008fb3);
            color: #1a1a1a;
            padding: 20px 60px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.3rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,212,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start:hover {
            background: #fff;
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.3);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>🎬 CineManager</h1>
        <p>Gestiona la teva col·lecció de pel·lícules, explora el catàleg global i organitza les teves properes sessions de cinema.</p>
        <a href="access.php" class="btn-start">COMENÇAR ARA</a>
    </div>
</body>
</html>
